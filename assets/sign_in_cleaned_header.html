<style>
        /* Ambient subtle glows for the technical, dark canvas feel */
        .ambient-glow-top-left {
            position: absolute;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(173, 199, 255, 0.05) 0%, rgba(18, 19, 22, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        .ambient-glow-bottom-right {
            position: absolute;
            bottom: -150px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(173, 199, 255, 0.03) 0%, rgba(18, 19, 22, 0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
        }
        /* Custom input styles for pure flat design */
        .flat-input {
            background-color: transparent !important;
            border: none !important;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1) !important;
            border-radius: 0 !important;
            box-shadow: none !important;
            padding-left: 0 !important;
            padding-right: 0 !important;
            transition: border-color 0.2s ease;
        }
        .flat-input:focus {
            border-bottom-color: #adc7ff !important;
            outline: none !important;
            box-shadow: none !important;
        }
        .flat-input::placeholder {
            color: rgba(196, 198, 208, 0.5);
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen relative overflow-hidden flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Glows -->
<div class="ambient-glow-top-left"></div>
<div class="ambient-glow-bottom-right"></div>
<!-- Main Content Canvas -->
<main class="grid grid-rows-5 w-full max-w-md mx-auto md:max-w-lg relative z-10 h-screen min-h-[100dvh]">
<!-- Rows 1-2: Header Section -->
<div class="row-span-2 flex flex-col items-center justify-center pt-8 px-margin text-center">
<div class="w-48 h-48 mb-6 filter invert opacity-90 mix-blend-screen flex items-center justify-center"></div>
</div>
<!-- Rows 3-4: Form Section -->
<div class="row-span-2 flex flex-col justify-center px-margin">
<form class="flex flex-col gap-lg w-full" onsubmit="event.preventDefault();">
<!-- Email Input -->
<div class="relative w-full">
<input class="flat-input w-full font-body-lg text-body-lg text-on-background py-sm" id="email" placeholder="Email address" required="" type="email"/>
</div>
<!-- Password Input -->
<div class="relative w-full mt-sm">
<input class="flat-input w-full font-body-lg text-body-lg text-on-background py-sm" id="password" placeholder="Password" required="" type="password"/>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end mt-xs">
<a class="font-label-md text-label-md text-on-surface-variant opacity-60 hover:opacity-100 transition-opacity" href="#">Forgot password?</a>
</div>
</form>
</div>
<!-- Row 5: Bottom Navigation -->
<div class="row-span-1 flex items-end justify-center pb-12 px-margin">
<div class="w-full bg-surface-container-high rounded-full p-2 flex items-center justify-between shadow-lg">
<button class="flex-1 py-3 px-4 font-body-md text-on-surface-variant hover:text-on-surface transition-colors" type="button">Register</button>
<button aria-label="Sign up with Google" class="flex-none w-12 h-12 bg-surface-container-highest rounded-full flex items-center justify-center hover:bg-white/10 transition-colors mx-1" type="button">
<svg fill="none" height="20" viewbox="0 0 24 24" width="20" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
</button>
<button class="flex-1 py-3 px-4 bg-primary-fixed-dim text-black font-body-md font-semibold rounded-full hover:bg-opacity-90 active:scale-[0.98] transition-all" type="submit">Login</button>
</div>
</div>
</main>
</body></html>
