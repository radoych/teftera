<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .viewfinder-mask {
            clip-path: polygon(0% 0%, 0% 100%, 15% 100%, 15% 15%, 85% 15%, 85% 75%, 15% 75%, 15% 100%, 100% 100%, 100% 0%);
        }
        .bracket {
            width: 24px;
            height: 24px;
            border-color: rgba(255, 255, 255, 0.8);
            position: absolute;
        }
        .shutter-inner {
            box-shadow: 0 0 0 4px #adc7ff;
        }
        body {
            background-color: #000;
            overflow: hidden;
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-black text-on-surface select-none">
<!-- Live Camera Viewport -->
<div class="fixed inset-0 z-0 overflow-hidden">
<img alt="Live camera view" class="w-full h-full object-cover grayscale-[0.2] brightness-75" data-alt="A top-down realistic live camera view of a long white paper receipt resting on a dark, rustic wooden table with a rich grain. The lighting is cinematic and moody, simulating a professional financial app's scanning interface. Soft shadows and high-definition details focus on the textures of the wood and the slightly crinkled paper, maintaining a technical and minimalist aesthetic in dark mode with cool blue undertones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBcbjCS78sKN-MoFfl6mb83zFiHfftEOA2fVUAjDdcZHt4s_h9QTslD-066x2fBjKcQCJT5ygncf6SKmL1pe6Lf22g-_HuAB0gT46KEeikIWX16mdskzzPt5hoQp3cjJX6bMOUpKIpGMZTfqdNqsOlu1xDmzPOjkOwavJsL6C6a711oZFRjPp_lUrwAGDC2DYeMm4F_fiqjO391wTxmhILBpVnKUBnIxX6vYw0wgtTB11AUK8ebGr_fD9k1CsCyd1v3m2_YRDqPr96-"/>
<!-- Viewfinder Overlay (Dimmed Edges) -->
<div class="absolute inset-0 bg-black/50 viewfinder-mask"></div>
<!-- Scanning Guides -->
<div class="absolute inset-0 flex items-center justify-center p-gutter">
<div class="relative w-full max-w-[320px] aspect-[2/3.5] flex flex-col items-center justify-center">
<!-- Corner Brackets -->
<div class="bracket top-0 left-0 border-t-2 border-l-2 rounded-tl-lg"></div>
<div class="bracket top-0 right-0 border-t-2 border-r-2 rounded-tr-lg"></div>
<div class="bracket bottom-0 left-0 border-b-2 border-l-2 rounded-bl-lg"></div>
<div class="bracket bottom-0 right-0 border-b-2 border-r-2 rounded-br-lg"></div>
<!-- Active Scanning Line Animation -->
<div class="absolute top-0 left-0 w-full h-[2px] bg-primary-container/40 blur-sm animate-[scan_3s_ease-in-out_infinite]"></div>
<div class="absolute top-0 left-0 w-full h-[1px] bg-primary-container animate-[scan_3s_ease-in-out_infinite]"></div>
</div>
</div>
</div>
<!-- UI Layer -->
<div class="relative z-10 h-screen w-full flex flex-col justify-between">
<!-- Top Bar -->
<header class="px-gutter pt-xl flex items-start">
<button class="flex items-center justify-center w-10 h-10 rounded-full bg-surface-container-highest/40 backdrop-blur-md active:scale-90 transition-transform">
<span class="material-symbols-outlined text-on-surface" data-icon="close">close</span>
</button>
</header>
<!-- Bottom Controls -->
<footer class="flex flex-col items-center pb-xxl px-gutter">
<!-- Hint Text -->
<div class="mb-xl text-center">
<p class="font-body-md text-body-md text-white tracking-wide opacity-90">
                    Align receipt within frame
                </p>
</div>
<!-- Main Controls Cluster -->
<div class="w-full flex items-center justify-between max-w-sm">
<!-- Flash Toggle -->
<button class="w-12 h-12 flex items-center justify-center rounded-full border border-white/20 bg-white/5 active:bg-white/20 transition-colors" id="flash-toggle">
<span class="material-symbols-outlined text-white" data-icon="bolt">bolt</span>
</button>
<!-- Capture Button -->
<button class="group relative flex items-center justify-center w-20 h-20 active:scale-95 transition-transform duration-150" id="capture-btn">
<div class="absolute inset-0 rounded-full border-4 border-primary-container opacity-100 group-active:scale-110 transition-transform"></div>
<div class="w-[60px] h-[60px] rounded-full bg-white shadow-[0_0_20px_rgba(173,199,255,0.4)]"></div>
</button>
<!-- Gallery Access -->
<button class="w-12 h-12 flex items-center justify-center rounded-full border border-white/20 bg-white/5 active:bg-white/20 transition-colors overflow-hidden">
<span class="material-symbols-outlined text-white" data-icon="photo_library">photo_library</span>
</button>
</div>
</footer>
</div>
<style>
        @keyframes scan {
            0%, 100% { transform: translateY(0); opacity: 0.2; }
            50% { transform: translateY(500%); opacity: 1; }
        }
    </style>
<script>
        // Micro-interactions
        const captureBtn = document.getElementById('capture-btn');
        const flashToggle = document.getElementById('flash-toggle');

        captureBtn.addEventListener('click', () => {
            // Trigger a quick flash overlay effect
            const flash = document.createElement('div');
            flash.className = 'fixed inset-0 z-[100] bg-white opacity-100 transition-opacity duration-300';
            document.body.appendChild(flash);
            
            setTimeout(() => {
                flash.style.opacity = '0';
                setTimeout(() => flash.remove(), 300);
            }, 50);

            // Haptic feedback simulation
            if (window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }
        });

        let flashActive = false;
        flashToggle.addEventListener('click', () => {
            flashActive = !flashActive;
            const icon = flashToggle.querySelector('.material-symbols-outlined');
            if (flashActive) {
                flashToggle.classList.add('bg-primary-container', 'text-on-primary-container');
                flashToggle.classList.remove('bg-white/5', 'text-white');
                icon.style.fontVariationSettings = "'FILL' 1";
            } else {
                flashToggle.classList.remove('bg-primary-container', 'text-on-primary-container');
                flashToggle.classList.add('bg-white/5', 'text-white');
                icon.style.fontVariationSettings = "'FILL' 0";
            }
        });

        // Prevent default double-tap zoom
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body></html>
