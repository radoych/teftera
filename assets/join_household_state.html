<style>
        body {
            background-color: #131314;
            color: #e3e2e6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .glow-top-left {
            position: fixed;
            top: -100px;
            left: -100px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(173, 199, 255, 0.08) 0%, rgba(19, 19, 20, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .glow-bottom-right {
            position: fixed;
            bottom: -100px;
            right: -100px;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(173, 199, 255, 0.05) 0%, rgba(19, 19, 20, 0) 70%);
            pointer-events: none;
            z-index: 0;
        }

        .hairline-divider {
            height: 1px;
            background-color: rgba(255, 255, 255, 0.05);
            width: 100%;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        input:focus {
            outline: none;
            border-bottom-color: #adc7ff !important;
        }

        .active-pill {
            background-color: #adc7ff;
            color: #112f5e;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="flex flex-col min-h-screen">
<!-- Atmospheric Glows -->
<div class="glow-top-left"></div>
<div class="glow-bottom-right"></div>
<!-- Main Content -->
<main class="flex-grow flex flex-col px-margin pt-xxl pb-xl relative z-10 max-w-md mx-auto w-full">
<!-- Top Header -->
<header class="mb-xl">
<h1 class="font-headline-xl text-headline-xl text-on-background mb-sm tracking-tight">Set up your household</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant opacity-70">Teftera works best when shared with someone you trust.</p>
</header>
<!-- Segmented Control -->
<section class="flex bg-surface-container-low p-1 rounded-full border border-white/5 mb-xl">
<button class="flex-1 py-3 px-4 font-label-md text-label-md rounded-full transition-all duration-300 text-on-surface-variant">
                Create household
            </button>
<button class="flex-1 py-3 px-4 font-label-md text-label-md rounded-full hover:text-on-surface transition-all duration-300 active-pill">
                Join household
            </button>
</section>
<!-- Create State Content -->
<div class="space-y-xl"><div class="group">
<label class="font-label-md text-label-md text-on-surface-variant opacity-60 mb-2 block tracking-widest uppercase" for="invite-code">Invite Code</label>
<input class="w-full bg-transparent border-0 border-b border-white/10 py-4 font-data-mono text-[32px] text-on-background placeholder:text-on-surface-variant/30 focus:ring-0 transition-all duration-300 px-0 tracking-widest uppercase" id="invite-code" maxlength="9" placeholder="e.g. TEFT-7K2X" type="text"/>
</div>
<button class="w-full py-4 bg-primary text-on-primary font-label-md text-label-md rounded-full active:scale-95 transition-transform duration-200">
  Join household
</button>
<p class="text-center font-body-md text-body-md text-on-surface-variant opacity-60 px-4">
  Enter the 8-character code shared by your partner to sync your finances.
</p></div>
<!-- Spacer -->
<div class="flex-grow"></div>
<!-- Footer Action -->
<footer class="mt-xxl text-center">
<button class="font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-colors opacity-60 hover:opacity-100">
                Skip for now — I'll invite them later
            </button>
</footer>
</main>
<script>
        // Micro-interactions for the segmented control
        const segments = document.querySelectorAll('section button');
        segments.forEach(btn => {
            btn.addEventListener('click', () => {
                segments.forEach(b => b.classList.remove('active-pill', 'text-on-surface-variant'));
                btn.classList.add('active-pill');
                // Other logic for switching views would go here
            });
        });

        // Simple Copy Logic Interaction
        const copyBtn = document.querySelector('button .material-symbols-outlined[content_copy]');
        if(copyBtn) {
            copyBtn.parentElement.addEventListener('click', () => {
                const original = copyBtn.innerText;
                copyBtn.innerText = 'check';
                copyBtn.style.color = '#ccff00'; // Cyber Lime hint
                setTimeout(() => {
                    copyBtn.innerText = original;
                    copyBtn.style.color = '';
                }, 2000);
            });
        }
    </script>
</body></html>
