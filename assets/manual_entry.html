<style>

<body class="font-body-md text-body-md min-h-screen relative">
<!-- Atmospheric Glows -->
<div class="soft-glow -top-20 -left-20"></div>
<div class="soft-glow bottom-20 -right-20"></div>
<div class="max-w-md mx-auto min-h-screen flex flex-col relative z-10">
<!-- TopAppBar (Based on Shared Components JSON structure) -->
<header class="w-full top-0 sticky bg-background flex justify-between items-center px-6 py-4 z-50">
<button aria-label="Go back" class="flex items-center justify-center p-2 -ml-2 text-on-surface hover:opacity-80 transition-opacity active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-semibold text-on-background">Manual Entry</h1>
<button class="font-label-md text-label-md text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform px-2 py-1">
                DONE
            </button>
</header>
<main class="flex-grow">
<!-- Amount Input Section -->
<section class="mt-12 mb-16 flex flex-col items-center justify-center px-6">
<div class="flex items-center justify-center group">
<span class="font-headline-xl text-[64px] text-on-surface opacity-30 select-none">$</span>
<div class="relative">
<input autofocus="" class="bg-transparent border-none text-center font-headline-xl text-[64px] p-0 w-auto min-w-[120px] focus:ring-0 text-on-surface" maxlength="10" placeholder="0.00" type="text"/>
<span class="custom-cursor absolute right-[-4px] top-1/2 -translate-y-1/2"></span>
</div>
</div>
</section>
<!-- Form Section -->
<section class="space-y-0">
<!-- Merchant -->
<div class="hairline px-6 py-5 group flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-60">Merchant</label>
<input class="bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface w-full" placeholder="e.g. Starbucks" type="text"/>
</div>
<!-- Category -->
<div class="hairline px-6 py-5 group flex justify-between items-center cursor-pointer hover:bg-surface-container-low/20 transition-colors">
<div class="flex flex-col gap-1 w-full">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-60">Category</label>
<div class="font-body-lg text-body-lg text-on-surface-variant/40">Select Category</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
<!-- Date -->
<div class="hairline px-6 py-5 group flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-60">Date</label>
<input class="bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface w-full" placeholder="Today" type="text"/>
</div>
<!-- Account -->
<div class="hairline px-6 py-5 group flex justify-between items-center cursor-pointer hover:bg-surface-container-low/20 transition-colors">
<div class="flex flex-col gap-1 w-full">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-60">Account</label>
<div class="font-body-lg text-body-lg text-on-surface">Personal Account</div>
</div>
<span class="material-symbols-outlined text-on-surface-variant" data-icon="expand_more">expand_more</span>
</div>
<!-- Note -->
<div class="hairline px-6 py-5 group flex flex-col gap-1">
<label class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest opacity-60">Note</label>
<input class="bg-transparent border-none p-0 focus:ring-0 font-body-lg text-body-lg text-on-surface w-full" placeholder="Optional note" type="text"/>
</div>
</section>
<!-- Technical Detail Decoration -->
<section class="mt-12 px-6 pb-20 opacity-20">
<div class="flex justify-between items-end border-t border-white/5 pt-4">
<div class="flex flex-col gap-1">
<span class="font-label-md text-[10px] uppercase tracking-[0.2em]">Transaction ID</span>
<span class="font-data-mono text-[11px]">TX-9482-KINETIC</span>
</div>
<div class="flex flex-col items-end gap-1">
<span class="font-label-md text-[10px] uppercase tracking-[0.2em]">Precision Index</span>
<span class="font-data-mono text-[11px]">99.982%</span>
</div>
</div>
</section>

<!-- No Bottom Navigation Bar per requirements -->
</div>
<!-- Interaction Script -->
<script>
        // Simple micro-interaction for amount input scaling
        const amountInput = document.querySelector('input[type="text"][placeholder="0.00"]');
        const cursor = document.querySelector('.custom-cursor');
        
        amountInput.addEventListener('input', (e) => {
            const length = e.target.value.length;
            if (length > 6) {
                e.target.style.fontSize = '48px';
            } else {
                e.target.style.fontSize = '64px';
            }
            
            // Adjust cursor position based on text width
            // Since we use a standard input, we can't easily measure text width in pure CSS,
            // but for a "manual entry" feel, the fixed right position works well enough.
        });

        // Toggle focus state visual cues
        const inputs = document.querySelectorAll('input');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('bg-white/5');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('bg-white/5');
            });
        });
    </script>
</body></html>
